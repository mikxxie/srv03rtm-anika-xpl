name: Prepare Missing Binaries

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download misbin.7z from OpenXP
        run: |
          Invoke-WebRequest -Uri "https://theopenxp.org/download/files/2" -OutFile "misbin.7z"

      - name: Extract misbin.7z
        run: |
          7z x misbin.7z -oD:\extracted -y

      - name: Copy files to repository
        run: |
          mkdir -Force $env:GITHUB_WORKSPACE\binaries.x86fre
          Copy-Item -Path "D:\extracted\*" -Destination "$env:GITHUB_WORKSPACE\binaries.x86fre\" -Recurse -Force

      - name: Find and track files over 100MB with Git LFS
        run: |
          cd $env:GITHUB_WORKSPACE
          git lfs install
          $largeFiles = Get-ChildItem -Path binaries.x86fre -Recurse -File | Where-Object { $_.Length -gt 100MB }
          if ($largeFiles) {
            foreach ($file in $largeFiles) {
              $relativePath = $file.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1)
              git lfs track $relativePath
              Write-Host "Tracking with LFS: $relativePath ($([math]::Round($file.Length / 1MB, 2)) MB)"
            }
          } else {
            Write-Host "No files over 100MB found."
          }
          git add .gitattributes

      - name: Clean up
        run: |
          Remove-Item misbin.7z -Force
          Remove-Item D:\extracted -Recurse -Force

      - name: Commit and push
        run: |
          cd $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add binaries.x86fre/
          git commit -m "Add missing binaries from misbin.7z [skip ci]" || echo "No changes"
          git push
