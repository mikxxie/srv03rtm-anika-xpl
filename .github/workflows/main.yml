name: Build Windows Server 2003

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GAH }}

      - name: Restore build cache
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            D:\srv03rtm\obj
            D:\srv03rtm\binaries.x86fre
            D:\srv03rtm\lib
          key: ${{ runner.os }}-build-${{ hashFiles('D:\srv03rtm\base\**', 'D:\srv03rtm\windows\**', 'D:\srv03rtm\shell\**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Set up source directory
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          if (Test-Path D:\srv03rtm) { Remove-Item D:\srv03rtm -Recurse -Force }
          New-Item -ItemType Directory -Path D:\srv03rtm -Force
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination "D:\srv03rtm\" -Recurse -Force
          attrib -r D:\srv03rtm /s /d

      - name: Disable Antivirus
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install Certificates
        run: |
          cd D:\srv03rtm\tools
          certutil -addstore Root testroot.cer
          certutil -addstore Root testpca.cer
          certutil -addstore Root vbl03ca.cer
          certutil -importPFX -p "" driver.pfx
          cd D:\srv03rtm

      - name: Fix SignTool certificate error
        run: |
         cd D:\srv03rtm\tools
         # Remove old certs first
         certutil -delstore Root testroot.cer
         certutil -delstore Root testpca.cer
         certutil -delstore Root vbl03ca.cer
         # Reinstall with proper flags
         certutil -addstore -f Root testroot.cer
         certutil -addstore -f Root testpca.cer
         certutil -addstore -f Root vbl03ca.cer
         certutil -importPFX -p "" driver.pfx

      - name: Generate new test certificates
        run: |
         cd D:\srv03rtm\tools
         git clone https://codeberg.org/openxp/certutil certgen
         cd certgen
         chmod 777 * -R
         dos2unix generate.sh
         ./generate.sh
         cp -r srv03rtm.certs/* ..
         cd ..
         rm -rf certgen
         certutil -addstore -f Root testroot.cer
         certutil -addstore -f Root testpca.cer
         certutil -addstore -f Root vbl03ca.cer
         certutil -importPFX -p "" driver.pfx

      - name: Prebuild
        run: |
          D:\srv03rtm\tools\prebuild.cmd

      - name: Initialize Build Environment
        run: |
          taskkill /F /IM notepad.exe 2>nul || echo "No notepad to kill"
          D:\srv03rtm\tools\razzle64.cmd free offline

      - name: Clean Build (first time or major changes)
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          D:\srv03rtm\tools\razzle64.cmd free offline "bcz -M 4"

      - name: Dirty Build (incremental, for small changes)
        if: steps.cache-build.outputs.cache-hit == 'true'
        run: |
          D:\srv03rtm\tools\razzle64.cmd free offline "bz -M 4"

      - name: Post-Build Processing
        run: |
          D:\srv03rtm\tools\razzle64.cmd free offline "D:\srv03rtm\tools\postbuild.cmd -full"
          D:\srv03rtm\tools\razzle64.cmd free offline "D:\srv03rtm\tools\postbuild.cmd -sku:srv"

      - name: Create ISO
        run: |
          D:\srv03rtm\tools\razzle64.cmd free offline "D:\srv03rtm\tools\oscdimg.cmd srv"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Server-2003-Build
          path: D:\*.iso
          retention-days: 30
